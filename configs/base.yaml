project:
  name: "mri-diffusion-pinn"
  description: "Physics-Informed Diffusion-PINN Framework for Accelerated MRI Image Reconstruction"

dataset:
  name: "fastMRI"
  anatomy: "knee"
  modality: "singlecoil"
  source: "official_NYU_fastMRI"

data:
  dataset_root: "data/fastmri"
  train_dir: "data/fastmri/knee_singlecoil_train"
  val_dir: "data/fastmri/knee_singlecoil_val"
  num_train_files: 30
  num_val_files: 10
  image_size: [320, 320]

experiment:
  acceleration: 4
  center_fraction: 0.08
  mask_type: "equispaced"
  seed: 42

training:
  batch_size: 1
  learning_rate: 0.0001
  epochs: 5

physics:
  lambda_image: 1.0
  lambda_kspace: 0.1
  lambda_physics: 0.1
  lambda_gradient: 0.1

diffusion:
  timesteps: 100
  base_channels: 32
  time_dim: 128

pinn:
  base_channels: 32
  num_blocks: 4

ablation:
  mode: "full"  # Options: full, diffusion_only, diffusion_kspace, diffusion_physics, diffusion_pinn_no_physics

paths:
  checkpoints_dir: "checkpoints"
  results_dir: "results"

evaluation:
  metrics:
    - psnr
    - ssim
    - nmse
    - kspace_error
