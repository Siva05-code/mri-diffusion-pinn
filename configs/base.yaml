project:
  name: "mri-diffusion-pinn"
  description: "Physics-Informed Diffusion-PINN Framework for Accelerated MRI Image Reconstruction"

data:
  dataset_source: "kaggle"
  kaggle_dataset: ""  # Format: "OWNER/DATASET-NAME" (Must be configured by developer)
  data_dir: "/kaggle/working/data/fastmri"

experiment:
  acceleration: 4
  seed: 42

training:
  batch_size: 1
  learning_rate: 0.0001
  epochs: 1

physics:
  lambda_kspace: 1.0
  lambda_physics: 1.0

evaluation:
  metrics:
    - psnr
    - ssim
    - nmse
    - kspace_error

