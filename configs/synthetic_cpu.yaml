# Tiny CPU-runnable config used to prove the pipeline learns.
# 64x64 phantoms, not for reporting any real result.
seed: 42
image_size: 64
accelerations: [4]
val_accelerations: [4]
center_fraction: 0.08
mask_mode: random
slice_range: [0.0, 1.0]

base_channels: 16
channel_mult: [1, 2, 4]
num_res_blocks: 1
attention_levels: [2]
time_dim: 64
dropout: 0.0

diffusion_steps: 400
beta_schedule: cosine
prediction_type: v
inference_steps: 16
eta: 0.0
residual_scale: 0

batch_size: 8
val_batch_size: 8
num_workers: 0
epochs: 12
learning_rate: 0.0006
weight_decay: 0.00001
grad_clip: 1.0
gradient_accumulation: 1
warmup_pct: 0.1
ema_decay: 0.99
amp: false

lambda_image: 1.0
lambda_kspace: 0.1
lambda_gradient: 0.01

use_mask_conditioning: true

max_train_files: 0
max_val_files: 0
max_train_slices: 0
max_val_slices: 0
val_max_batches: 4

train_cache: null
val_cache: null

refine_base_channels: 16
refine_depth: 2
refine_epochs: 3
refine_inference_steps: 8
refine_learning_rate: 0.0005

# --- quality levers (v2) ---
min_snr_gamma: 5.0          # min-SNR-gamma loss rebalancing; 0 disables
lambda_ssim: 0.1            # put SSIM in the objective, not just the report
t_start_frac: 0.5           # where to start the reverse chain; lower = higher PSNR
val_num_samples: 1          # samples averaged during validation (keep 1, it is slow)
eval_num_samples: 4         # samples averaged at final evaluation
eval_tta: false             # flip ensembling at evaluation; costs 4x
