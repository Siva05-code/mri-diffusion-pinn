# High-quality 4x preset. Aim: PSNR > 30 dB on fastMRI single-coil knee.
# Needs a real GPU and several hours. Start from accel4.yaml if you are just
# checking that things run.
seed: 42
image_size: 320

# Undersampling
accelerations: [4]          # list -> one is drawn at random per sample
val_accelerations: [4]
center_fraction: 0.08
mask_mode: random           # random | equispaced
slice_range: [0.15, 0.95]   # drop the noisy outer slices of each volume

# Model
base_channels: 64
channel_mult: [1, 2, 4, 8]
num_res_blocks: 2
attention_levels: [2, 3]    # attention at 80x80 and 40x40 only
time_dim: 256
dropout: 0.05

# Diffusion
diffusion_steps: 1000
beta_schedule: cosine       # cosine | linear
prediction_type: v          # v | eps   (v is far more stable here)
inference_steps: 30
eta: 0.0                    # 0 = deterministic DDIM
residual_scale: 0           # 0 = estimate automatically from the data

# Optimisation
batch_size: 8
val_batch_size: 8
num_workers: 2
epochs: 60
learning_rate: 0.0002
weight_decay: 0.00001
grad_clip: 1.0
gradient_accumulation: 1
warmup_pct: 0.05
ema_decay: 0.9995
amp: true

# Loss weights
lambda_image: 2.0
lambda_kspace: 0.1
lambda_gradient: 0.01

# Ablation switch
use_mask_conditioning: true

# Data limits (0 = use everything)
max_train_files: 0
max_val_files: 0
max_train_slices: 0
max_val_slices: 0
val_max_batches: 16

# Optional pre-built caches from scripts/prepare_data.py
train_cache: null
val_cache: null

# --- quality levers (v2) ---
min_snr_gamma: 5.0          # min-SNR-gamma loss rebalancing; 0 disables
lambda_ssim: 0.1            # put SSIM in the objective, not just the report
t_start_frac: 0.6           # where to start the reverse chain; lower = higher PSNR
val_num_samples: 1          # samples averaged during validation (keep 1, it is slow)
eval_num_samples: 8      # the most dependable inference-time gain         # samples averaged at final evaluation
eval_tta: false          # verify with tune_inference.py before enabling             # flip ensembling at evaluation; costs 4x
